name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  api:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: albus
          POSTGRES_PASSWORD: albus_dev_password
          POSTGRES_DB: albus
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U albus -d albus"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    env:
      DATABASE_URL: postgresql+psycopg2://albus:albus_dev_password@localhost:5432/albus
      JWT_SECRET: ci-secret-not-used-in-prod
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: api/requirements.txt
      - name: Install deps
        working-directory: api
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt
      - name: Migrate
        working-directory: api
        run: alembic upgrade head
      - name: Pytest
        working-directory: api
        run: pytest -ra

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install
        working-directory: web
        run: npm install --no-audit --no-fund
      - name: Typecheck
        working-directory: web
        run: npm run typecheck
      - name: Lint
        working-directory: web
        run: npm run lint -- --max-warnings=0 || true
