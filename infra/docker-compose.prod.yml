services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - /srv/albus/db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20

  api:
    build: ../api
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+psycopg2://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      APP_DATABASE_URL: postgresql+psycopg2://albus_app:albus_app_password@db:5432/${POSTGRES_DB}
      JWT_SECRET: ${JWT_SECRET}
      JWT_ALGORITHM: HS256
      JWT_TTL_MINUTES: 60
      # Path-based tenancy: a single host serves every customer. CORS
      # only needs the apex + (optionally) www.
      CORS_ORIGINS: https://trivu.net,https://www.trivu.net
      PUBLIC_BASE_URL: https://trivu.net
      # SMTP — fill in /srv/albus/.env. EMAIL_ENABLED=false logs invites
      # to console; set true once SMTP credentials are valid.
      SMTP_HOST: ${SMTP_HOST}
      SMTP_PORT: ${SMTP_PORT}
      SMTP_USERNAME: ${SMTP_USERNAME}
      SMTP_PASSWORD: ${SMTP_PASSWORD}
      SMTP_FROM: ${SMTP_FROM}
      SMTP_USE_TLS: ${SMTP_USE_TLS}
      EMAIL_ENABLED: ${EMAIL_ENABLED}
    depends_on:
      db:
        condition: service_healthy

  web:
    build:
      context: ../web
      args:
        NEXT_PUBLIC_API_BASE_URL: https://api.trivu.net
    restart: unless-stopped
    depends_on:
      - api

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - /srv/albus/caddy/data:/data
      - /srv/albus/caddy/config:/config
    depends_on:
      - api
      - web
