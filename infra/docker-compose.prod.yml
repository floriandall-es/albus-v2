services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - /srv/albus/db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20

  api:
    build: ../api
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+psycopg2://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      APP_DATABASE_URL: postgresql+psycopg2://albus_app:albus_app_password@db:5432/${POSTGRES_DB}
      JWT_SECRET: ${JWT_SECRET}
      JWT_ALGORITHM: HS256
      JWT_TTL_MINUTES: 60
      CORS_ORIGINS: https://__DOMAIN__,https://*.__DOMAIN__
    depends_on:
      db:
        condition: service_healthy

  web:
    build: ../web
    restart: unless-stopped
    environment:
      NEXT_PUBLIC_API_BASE_URL: https://api.__DOMAIN__
      NEXT_PUBLIC_ROOT_DOMAIN: __DOMAIN__
    depends_on:
      - api

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - /srv/albus/caddy/data:/data
      - /srv/albus/caddy/config:/config
    depends_on:
      - api
      - web
