services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - /srv/albus/db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20

  api:
    build: ../api
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+psycopg2://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      APP_DATABASE_URL: postgresql+psycopg2://albus_app:albus_app_password@db:5432/${POSTGRES_DB}
      JWT_SECRET: ${JWT_SECRET}
      JWT_ALGORITHM: HS256
      # Session length. Was 60 (a leftover from early testing) which
      # logged users out one hour after login, mid-shift, with no
      # refresh flow to renew. 720 = 12h covers a full clinical shift.
      # The expiry is absolute (no sliding renewal yet), so this is the
      # hard ceiling. Proper fix — a refresh-token flow — is tracked in
      # docs/production-hardening.md.
      JWT_TTL_MINUTES: 720
      # HMAC key for invitation token lookup (sprint 17). Set this in
      # /srv/albus/.env. Rotating it invalidates every pending invite.
      INVITATION_LOOKUP_SECRET: ${INVITATION_LOOKUP_SECRET}
      # Path-based tenancy: a single host serves every customer. CORS
      # only needs the apex + (optionally) www.
      CORS_ORIGINS: https://trivu.net,https://www.trivu.net
      PUBLIC_BASE_URL: https://trivu.net
      # SMTP — fill in /srv/albus/.env. EMAIL_ENABLED=false logs invites
      # to console; set true once SMTP credentials are valid.
      SMTP_HOST: ${SMTP_HOST}
      SMTP_PORT: ${SMTP_PORT}
      SMTP_USERNAME: ${SMTP_USERNAME}
      SMTP_PASSWORD: ${SMTP_PASSWORD}
      SMTP_FROM: ${SMTP_FROM}
      SMTP_USE_TLS: ${SMTP_USE_TLS}
      EMAIL_ENABLED: ${EMAIL_ENABLED}
      # Ops alerting (P1, in-house — no Sentry). When set, unhandled
      # 500s + background-job failures email this address (throttled,
      # 30 min/key). Unset → alerts no-op, errors still hit the logs.
      # Put OPS_ALERT_EMAIL=you@example.com in /srv/albus/.env.
      OPS_ALERT_EMAIL: ${OPS_ALERT_EMAIL:-}
      AVATARS_DIR: /app/avatars
      # Chat voice notes (migration 0093). Host volume below; back it
      # up alongside avatars + the DB.
      VOICE_NOTES_DIR: /app/voice-notes
      # Web Push (migration 0089). Pasted into /srv/albus/.env from
      # `npx web-push generate-vapid-keys`. SUBJECT is a mailto: or
      # https:// URI the push services email if abuse is detected.
      # All three must be present together — if any is empty the
      # API still boots but the push code paths silently no-op and
      # `GET /api/push/vapid-public-key` returns 503.
      VAPID_PUBLIC_KEY: ${VAPID_PUBLIC_KEY}
      VAPID_PRIVATE_KEY: ${VAPID_PRIVATE_KEY}
      VAPID_SUBJECT: ${VAPID_SUBJECT}
      # Stripe (migration 0080). Filled in /srv/albus/.env once the
      # Stripe Dashboard side is configured. Empty values are fine
      # — stripe_client.py short-circuits with a RuntimeError on
      # call, which never fires for the grandfathered alpha tenant
      # (stripe_subscription_id IS NULL → reconcile paths exit
      # early). New paying signups need these set.
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET}
      STRIPE_PRICE_ADMIN: ${STRIPE_PRICE_ADMIN}
      STRIPE_PRICE_MEMBER: ${STRIPE_PRICE_MEMBER}
    volumes:
      # Profile photos uploaded by users. Host directory is created by
      # bootstrap; back this up alongside the DB.
      - /srv/albus/avatars:/app/avatars
      # Chat voice-note audio. Created on first upload; the API also
      # mkdir -p's it on startup. Back this up alongside avatars.
      - /srv/albus/voice-notes:/app/voice-notes
      # Read-only mount for one-off CSV → Trivu migrations (the
      # `scripts/migrate_legacy.py` path). The script computes
      # DATA_DIR as `/data/legacy-migration` inside the container,
      # so we mount the host directory there. Mount is harmless
      # when the host dir is empty — Docker creates an empty dir
      # if `/srv/albus/legacy-migration` doesn't exist yet.
      - /srv/albus/legacy-migration:/data/legacy-migration:ro
    depends_on:
      db:
        condition: service_healthy

  web:
    build:
      context: ../web
      args:
        NEXT_PUBLIC_API_BASE_URL: https://api.trivu.net
    restart: unless-stopped
    depends_on:
      - api

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - /srv/albus/caddy/data:/data
      - /srv/albus/caddy/config:/config
    depends_on:
      - api
      - web
