services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-albus}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-albus_dev_password}
      POSTGRES_DB: ${POSTGRES_DB:-albus}
    ports:
      - "55432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-albus} -d ${POSTGRES_DB:-albus}"]
      interval: 3s
      timeout: 3s
      retries: 20

  mailhog:
    # Catches outgoing SMTP in dev. Web UI at http://localhost:8125 on the
    # host (the standard 8025/1025 ports are sometimes already taken by other
    # local projects — albus uses 8125/1125 to coexist). Inside the compose
    # network the API still talks to `mailhog:1025`.
    image: mailhog/mailhog:v1.0.1
    ports:
      - "8125:8025"
      - "1125:1025"

  api:
    build: ./api
    environment:
      DATABASE_URL: postgresql+psycopg2://${POSTGRES_USER:-albus}:${POSTGRES_PASSWORD:-albus_dev_password}@db:5432/${POSTGRES_DB:-albus}
      APP_DATABASE_URL: postgresql+psycopg2://albus_app:albus_app_password@db:5432/${POSTGRES_DB:-albus}
      JWT_SECRET: ${JWT_SECRET:-change-me-in-prod-this-is-only-for-dev}
      JWT_ALGORITHM: HS256
      JWT_TTL_MINUTES: 60
      CORS_ORIGINS: http://localhost:3030,http://localhost:3000
      SMTP_HOST: ${SMTP_HOST:-mailhog}
      SMTP_PORT: ${SMTP_PORT:-1025}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-Albus <noreply@albus.local>}
      SMTP_USE_TLS: ${SMTP_USE_TLS:-false}
      EMAIL_ENABLED: ${EMAIL_ENABLED:-true}
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000"
    volumes:
      - ./api:/app

  web:
    # NEXT_PUBLIC_* values must be passed as BUILD args, not runtime env —
    # Next.js inlines them into the client bundle at build time. Setting
    # them under `environment:` here is a no-op (and was the cause of the
    # bug where prod served a bundle hardcoded to http://localhost:8000).
    # On prod, set NEXT_PUBLIC_API_BASE_URL=https://trivu.net (and the
    # root domain) in .env before `docker compose build web`.
    build:
      context: ./web
      args:
        NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-http://localhost:8000}
        NEXT_PUBLIC_ROOT_DOMAIN: ${NEXT_PUBLIC_ROOT_DOMAIN:-localhost}
    depends_on:
      - api
    ports:
      - "3030:3000"

volumes:
  db_data:
